<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realm of Nations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero">
        <div class="overlay"></div>

        <div class="hero-content">
            <h1>Realm of Nations</h1>
            <button class="btn" onclick="window.location.href='assortment.html'">К ассортименту</button>
        </div>

        <!-- ОНЛАЙН СТАТУС -->
        <div class="online-status">
            <span id="status-dot">🟢</span>
            <span id="status-text">Онлайн на нашем сервере: <span id="players-count">0</span></span>
        </div>

        <!-- IP в правом нижнем углу -->
        <div class="ip-corner" onclick="copyIP()">
            <span>realmofnations.my-craft.cc:36020</span>
        </div>
    </section>

    <script>
        function copyIP() {
            const ip = 'realmofnations.my-craft.cc:36020';
            navigator.clipboard.writeText(ip);
            alert('✅ IP скопирован: ' + ip);
        }

        async function getServerStatus() {
            try {
                // Пробуем через mcapi.us
                const response = await fetch('https://mcapi.us/server/status?ip=185.9.145.7&port=36020');
                const data = await response.json();

                const dot = document.getElementById('status-dot');
                const count = document.getElementById('players-count');

                if (data.online) {
                    dot.textContent = '🟢';
                    count.textContent = data.players.now || '0';
                } else {
                    dot.textContent = '🔴';
                    count.textContent = '0';
                }
            } catch (e) {
                // Запасной вариант
                try {
                    const response2 = await fetch('https://api.mcsrvstat.us/2/185.9.145.7:36020');
                    const data2 = await response2.json();

                    const dot = document.getElementById('status-dot');
                    const count = document.getElementById('players-count');

                    if (data2.online) {
                        dot.textContent = '🟢';
                        count.textContent = data2.players.online || '0';
                    } else {
                        dot.textContent = '🔴';
                        count.textContent = '0';
                    }
                } catch (e2) {
                    document.getElementById('status-dot').textContent = '🟡';
                    document.getElementById('players-count').textContent = '?';
                }
            }
        }

        getServerStatus();
        setInterval(getServerStatus, 30000);
    </script>

</body>
</html>
