<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realm of Nations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero">
        <div class="overlay"></div>
        <div class="hero-content">
            <h1>Realm of Nations</h1>
            <p class="ip">realmofnations.my-craft.cc:36020</p>
            <button class="btn" onclick="copyIP()">📋 Копировать IP</button>
        </div>
    </section>

    <script>
        function copyIP() {
            const ip = 'realmofnations.my-craft.cc:36020';
            navigator.clipboard.writeText(ip);
            alert('✅ IP скопирован: ' + ip);
        }
    </script>

</body>
</html>
